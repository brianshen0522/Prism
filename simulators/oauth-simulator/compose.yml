services:
  oauth-simulator:
    build: .
    environment:
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: 4010
      RESOURCE_HOST: 0.0.0.0
      RESOURCE_PORT: 4020
      PARTICIPANT_HEADER_NAME: ${PARTICIPANT_HEADER_NAME:-X-Participant-Token}
      AUTH_TOKEN_ENDPOINT: ${AUTH_TOKEN_ENDPOINT:-/oauth/token}
      AUTH_VALIDATE_ENDPOINT: ${AUTH_VALIDATE_ENDPOINT:-/oauth/validate}
      VALIDATION_SUCCESS_PATH: ${VALIDATION_SUCCESS_PATH:-active}
      VALIDATION_SUCCESS_VALUE: ${VALIDATION_SUCCESS_VALUE:-true}
      AUTH_VALIDATE_BASE_URL: ${AUTH_VALIDATE_BASE_URL:-http://127.0.0.1:4010}
    ports:
      - "${AUTH_PORT:-4010}:4010"
      - "${RESOURCE_PORT:-4020}:4020"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oauth-driver:
    build: .
    profiles: ["tools"]
    depends_on:
      - oauth-simulator
    entrypoint: ["node", "dist/driver.js"]
    environment:
      CLIENT_AUTH_BASE_URL: ${CLIENT_AUTH_BASE_URL:-http://oauth-simulator:4010}
      CLIENT_RESOURCE_BASE_URL: ${CLIENT_RESOURCE_BASE_URL:-http://oauth-simulator:4020}
      PARTICIPANT_HEADER_NAME: ${PARTICIPANT_HEADER_NAME:-X-Participant-Token}
      PARTICIPANT_TOKEN_VALUE: ${PARTICIPANT_TOKEN_VALUE:-demo-participant-token}
      AUTH_TOKEN_ENDPOINT: ${AUTH_TOKEN_ENDPOINT:-/oauth/token}
      AUTH_VALIDATE_ENDPOINT: ${AUTH_VALIDATE_ENDPOINT:-/oauth/validate}
    extra_hosts:
      - "host.docker.internal:host-gateway"
