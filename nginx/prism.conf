# Prism — Nginx reverse-proxy configuration
# Place this file in /etc/nginx/conf.d/ (or include it from nginx.conf).
# Nginx handles TLS termination; the app runs on HTTP internally.
#
# Adjust the following before deploying:
#   - server_name       → your public hostname
#   - ssl_certificate   → path to your certificate chain (PEM)
#   - ssl_certificate_key → path to your private key (PEM)
#   - proxy_pass        → host:port of the Prism container (default 3000)
#
# Proxy ports (7001-7100) must be exposed directly from the container/host;
# they are plain HTTP and are not routed through this Nginx block.

upstream prism_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name prism.example.com;

    return 301 https://$host$request_uri;
}

# ── HTTPS + WSS ───────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prism.example.com;

    # TLS
    ssl_certificate     /etc/ssl/prism/fullchain.pem;
    ssl_certificate_key /etc/ssl/prism/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Upload size (covers large FHIR payloads)
    client_max_body_size 64m;

    # ── WebSocket endpoint (/ws) ─────────────────────────────────────────────

    location /ws {
        proxy_pass         http://prism_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # keep WS connections alive
    }

    # ── REST API + static frontend ────────────────────────────────────────────

    location / {
        proxy_pass         http://prism_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
